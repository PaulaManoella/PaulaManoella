<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 45" width="100%">
  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    @keyframes steam {
      0% { transform: translateY(0px); opacity: 0; }
      25% { opacity: 1; }
      75% { opacity: 0.8; }
      100% { transform: translateY(-4px); opacity: 0; }
    }
    @keyframes catBreathe {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-0.5px); }
    }
    @keyframes floatZ {
      0% { transform: translate(0px, 0px); opacity: 0; }
      30% { opacity: 1; }
      100% { transform: translate(2px, -4px); opacity: 0; }
    }
    .cursor { animation: blink 1s steps(1) infinite; }
    .s1 { animation: twinkle 2s steps(2) infinite; }
    .s2 { animation: twinkle 2.8s steps(2) infinite 0.7s; }
    .s3 { animation: twinkle 2.4s steps(2) infinite 1.4s; }
    .st1 { animation: steam 2.2s steps(4) infinite; }
    .st2 { animation: steam 2.2s steps(4) infinite 1.1s; }
    .cat-top { animation: catBreathe 2.8s steps(2) infinite; }
    .z1 { animation: floatZ 2.6s steps(4) infinite; }
    .z2 { animation: floatZ 2.6s steps(4) infinite 1.3s; }
  </style>

  
