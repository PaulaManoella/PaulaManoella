<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="100%" height="270">
  <defs>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#190B2E" />
      <stop offset="100%" stop-color="#2D1552" />
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E061F" />
      <stop offset="60%" stop-color="#28124D" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>
    <linearGradient id="deskTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="50%" stop-color="#5B21B6" />
      <stop offset="100%" stop-color="#3B1578" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#C084FC" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
    <clipPath id="windowClip">
      <rect x="618" y="26" width="292" height="168" rx="4" />
    </clipPath>
  </defs>

  <style>
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes steam {
      0% { transform: translateY(0px); opacity: 0; }
      30% { opacity: 0.7; }
      100% { transform: translateY(-20px); opacity: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
    @keyframes breathe {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.06); }
    }
    @keyframes floatZ {
      0% { transform: translate(0px, 0px); opacity: 0; }
      25% { opacity: 0.9; }
      100% { transform: translate(10px, -22px); opacity: 0; }
    }
    .star-1 { animation: twinkle 2.4s ease-in-out infinite; }
    .star-2 { animation: twinkle 3.1s ease-in-out infinite 0.8s; }
    .star-3 { animation: twinkle 2.7s ease-in-out infinite 1.5s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .steam-1 { animation: steam 2.6s ease-out infinite; }
    .steam-2 { animation: steam 2.6s ease-out infinite 1.3s; }
    .glow { animation: pulseGlow 3.5s ease-in-out infinite; }
    .cat-body { transform-box: fill-box; transform-origin: bottom center; animation: breathe 3.2s ease-in-out infinite; }
    .z1 { animation: floatZ 3s ease-out infinite; }
    .z2 { animation: floatZ 3s ease-out infinite 1.5s; }
  </style>

  
